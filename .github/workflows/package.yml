# Package the VS Code VSIX so anyone can download the latest build
# from Actions → package → artifacts.
name: package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm test
      - name: Package VSIX
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: slack-opener-${{ github.sha }}
          path: slack-opener-*.vsix
          if-no-files-found: error
